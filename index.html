/* Layout: no words, only play — reward bar, picture + blanks, garden board, d-pad */
:root{
  --sky:#E3E8FF; --sky-2:#F4E9FF; --ink:#33285F; --line:#C9CEF0;
  --grass:#8ACB74; --grass-2:#7FC168; --grass-edge:#5E9E4B; --tile:#FFD251; --tile-edge:#E3A92A;
  --uni:#FFFFFF; --uni-edge:#D6C8F2; --good:#2FA36B; --oops:#E0533D; --gold:#FFC23A; --card:#FFFFFF;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  color-scheme:light;
}
html,body{background:linear-gradient(180deg,var(--sky),var(--sky-2)) fixed;color:var(--ink);min-height:100%}
body{margin:0;font-family:var(--display);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 24px;-webkit-tap-highlight-color:transparent}
button{font-family:var(--display);-webkit-user-select:none;user-select:none}
button:focus-visible{outline:3px solid var(--oops);outline-offset:3px}
.wrap{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:12px}

.brand{display:flex;align-items:center;gap:10px;font-size:1.6rem;font-weight:800;line-height:1;color:var(--ink);letter-spacing:.01em}
.brand img{width:44px;height:44px;border-radius:12px;box-shadow:0 3px 0 var(--line)}
/* reward bar */
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px 12px}
.pips{display:flex;align-items:center;gap:6px;background:var(--card);border-radius:999px;padding:6px 10px 6px 12px;box-shadow:0 3px 0 var(--line)}
.pip{width:18px;height:18px;border-radius:50%;background:var(--sky);transition:background .3s,transform .3s}
.pip.on{background:var(--gold);transform:scale(1.15);box-shadow:inset 0 -3px 0 #E09A12}
.giftmini{font-size:1.5rem;line-height:1;margin-left:4px;transition:transform .3s}
.giftmini.ready{animation:wiggle .8s ease-in-out infinite}
.book{display:flex;align-items:center;gap:6px;border:0;background:var(--card);border-radius:999px;padding:4px 14px 4px 10px;font-size:1.3rem;font-weight:800;color:var(--ink);box-shadow:0 3px 0 var(--line);cursor:pointer;font-variant-numeric:tabular-nums}
.book .ic{font-size:1.5rem}
.book.bump{animation:pop .5s}

.modes{order:3;flex:1 0 100%;display:flex;background:var(--card);border-radius:999px;padding:4px;gap:2px;box-shadow:0 3px 0 var(--line)}
.modes button{flex:1;border:0;background:none;border-radius:999px;padding:6px 8px;white-space:nowrap;font-size:1.05rem;font-weight:800;color:var(--ink);opacity:.5;cursor:pointer}
.modes button[aria-pressed="true"]{background:var(--ink);color:#fff;opacity:1}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;border-top:3px dashed var(--line);padding-top:14px}
.chip{border-radius:10px;padding:2px 10px 4px;font-size:1.1rem;font-weight:800;background:var(--sky);color:var(--ink)}
.chip.no{opacity:.3}
.chip.gold{background:#FFF1C7;box-shadow:inset 0 0 0 3px var(--gold)}
@media (max-width:400px){.modes button{font-size:.95rem}.pips{gap:4px;padding-inline:8px}.pip{width:14px;height:14px}}
body.sight .tile,body.sight .slot,body.sight .islot,body.sight .bigword span,body.sight .flytile{text-transform:lowercase}
/* word card */
.card{background:var(--card);border-radius:22px;padding:12px 14px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;box-shadow:0 4px 0 var(--line)}
.pic{font-size:3.2rem;line-height:1;width:70px;height:70px;display:grid;place-items:center;background:var(--sky);border-radius:18px;border:0;cursor:pointer;padding:0}
.slots{display:flex;gap:6px;justify-content:center;min-width:0}
.slot{flex:0 1 48px;min-width:0;aspect-ratio:.84;box-sizing:border-box;border-radius:12px;border:3px dashed var(--line);display:grid;place-items:center;font-weight:800;font-size:1.8rem;color:var(--ink)}
.slot.next{border:3px solid var(--ink);animation:bobble 1.1s ease-in-out infinite}
.slot.filled{border:3px solid var(--tile-edge);background:var(--tile);animation:pop .35s ease-out}
.hear{width:52px;height:52px;border-radius:50%;border:0;background:var(--ink);color:#fff;font-size:1.5rem;cursor:pointer;display:grid;place-items:center}

/* start screen: one tap turns sound on (browsers only allow sound after a tap) */
.start{position:fixed;inset:0;z-index:40;display:grid;place-content:center;justify-items:center;gap:min(6vh,40px);background:linear-gradient(180deg,var(--sky),var(--sky-2))}
.start img{width:min(40vw,26vh,220px);height:auto;border-radius:22%;box-shadow:0 8px 0 var(--line);animation:bobble 1.6s ease-in-out infinite}
.go{width:min(30vw,18vh,150px);aspect-ratio:1;border-radius:50%;border:0;background:var(--good);color:#fff;font-size:min(13vw,8vh,64px);padding-left:.12em;box-shadow:0 8px 0 #1F7A4E;cursor:pointer;animation:pop 1.4s ease-in-out infinite}
.go:active{transform:translateY(5px);box-shadow:0 3px 0 #1F7A4E}
/* word intro */
.intro-dim{position:fixed;inset:0;z-index:24;background:rgba(51,40,95,.55);cursor:pointer}
.intro{position:fixed;inset:0;z-index:25;display:grid;place-content:center;justify-items:center;gap:min(5vh,36px);pointer-events:none;--is:min(19vw,13vh,120px)}
.ipic{width:min(46vw,34vh,300px);aspect-ratio:1;border-radius:18%;background:var(--card);display:grid;place-items:center;font-size:min(32vw,24vh,210px);line-height:1;transform-origin:0 0}
.islots{display:flex;gap:calc(var(--is)*.14)}
.islot{width:var(--is);aspect-ratio:.84;box-sizing:border-box;border-radius:calc(var(--is)*.2);border:calc(var(--is)*.06) dashed var(--line);background:var(--card);display:grid;place-items:center;font-weight:800;font-size:calc(var(--is)*.66);color:var(--ink);transform-origin:0 0;transition:color .25s}
.islot:first-child{border-style:solid;border-color:var(--ink)}
.intro.sight .islot{border-style:solid;border-color:var(--card)}
.intro.fading .islot{color:transparent}
.isent{max-width:min(92vw,720px);text-align:center;color:#fff;font-size:min(8vw,5vh,48px);font-weight:800;line-height:1.15;transition:opacity .3s}
.isent b{color:var(--tile)}
.intro.fading .isent{opacity:0}
.intro.sight .ipic{width:min(34vw,24vh,220px);font-size:min(24vw,17vh,150px)}
/* sight words: picture + sentence with a blank, letters below */
.sent{display:none}
body.sight .card{grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"pic sent hear" "pic slots hear";row-gap:8px}
body.sight .pic{grid-area:pic} body.sight .slots{grid-area:slots} body.sight .hear{grid-area:hear}
body.sight .sent{display:block;grid-area:sent;text-align:center;font-size:1.15rem;line-height:1.2;color:var(--ink)}
.sent .blank{display:inline-block;width:2em;height:.2em;border-radius:2px;background:var(--ink);margin:0 .12em;vertical-align:baseline}
/* board */
.board{position:relative;width:100%;aspect-ratio:1;max-width:100%;border-radius:22px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer;--cell:56px;
  background:repeating-conic-gradient(var(--grass) 0 25%,var(--grass-2) 0 50%) 0 0/calc(200%/7) calc(200%/7);box-shadow:0 6px 0 var(--grass-edge)}
.board::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 8px var(--oops);background:rgba(224,83,61,.18);opacity:0;pointer-events:none;transition:opacity .2s}
.board.wrong::after{opacity:1}
.piece{position:absolute;left:0;top:0;width:calc(100%/7);height:calc(100%/7);transition:transform .16s ease-out;display:grid;place-items:center}
.tile{position:relative;width:78%;height:78%;border-radius:14px;background:var(--tile);box-shadow:inset 0 -5px 0 var(--tile-edge);display:grid;place-items:center;font-weight:800;font-size:calc(var(--cell)*.48);color:var(--ink);padding-bottom:4px;box-sizing:border-box}
.tile.glow{animation:glow 1s ease-in-out infinite}
.tile.gone{transform:scale(0);transition:transform .15s ease-in}
.tile.wrong{background:var(--oops);color:#fff;box-shadow:inset 0 -5px 0 #A8321F;animation:shake .45s}
.tile.wrong::after{content:"✕";position:absolute;top:-22%;right:-22%;width:52%;height:52%;border-radius:50%;background:#fff;color:var(--oops);font-size:calc(var(--cell)*.22);display:grid;place-items:center;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.trail{position:absolute;left:0;top:0;width:calc(100%/7);height:calc(100%/7);display:grid;place-items:center;pointer-events:none}
.trail i{width:22%;height:22%;border-radius:50%;animation:fade .6s ease-out forwards}
.burst{position:absolute;left:0;top:0;width:calc(100%/7);height:calc(100%/7);pointer-events:none;z-index:3}
.burst i{position:absolute;left:45%;top:45%;width:12%;height:12%;border-radius:50%;animation:ray .55s ease-out forwards}

/* unicorn */
.buddy{z-index:2}
.bod{width:76%;height:76%;position:relative;transition:transform .16s}
.bob{width:100%;height:100%;border-radius:50% 50% 44% 44%;background:var(--uni);box-shadow:inset 0 -6px 0 var(--uni-edge);position:relative;animation:bobble 1.4s ease-in-out infinite}
.eye{position:absolute;top:30%;width:18%;height:22%;background:#fff;border-radius:50%;box-shadow:0 0 0 1px var(--uni-edge)}
.eye::after{content:"";position:absolute;right:12%;top:30%;width:50%;height:50%;background:var(--ink);border-radius:50%}
.eye.l{left:40%} .eye.r{left:66%}
.cheek{position:absolute;top:60%;left:72%;width:16%;height:10%;background:#FFB8CF;border-radius:50%}
.horn{position:absolute;left:55%;top:-28%;width:16%;height:36%;background:linear-gradient(#FFE58A,#F2B53A);clip-path:polygon(50% 0,100% 100%,0 100%)}
.ear{position:absolute;left:36%;top:-12%;width:15%;height:22%;background:var(--uni);clip-path:polygon(50% 0,100% 100%,0 100%)}
.mane{position:absolute;left:2%;top:4%;width:30%;height:72%;border-radius:60% 10% 10% 60%;background:linear-gradient(#FF8FB8,#FFB86B,#8FD3FF,#B49BFF)}
.acc{position:absolute;line-height:1;pointer-events:none}
.buddy.bump .bod{animation:squish .35s}
.board.wrong .buddy .bod{animation:shake .45s}
.buddy.happy .bob{animation:jump .5s ease-out 2}

/* d-pad */
.pad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,56px);gap:8px;justify-content:center}
.pad button{border:0;border-radius:16px;background:var(--card);color:var(--ink);font-size:1.5rem;cursor:pointer;box-shadow:0 4px 0 var(--line);touch-action:manipulation}
.pad button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.pad .up{grid-column:2;grid-row:1} .pad .left{grid-column:1;grid-row:2} .pad .down{grid-column:2;grid-row:2} .pad .right{grid-column:3;grid-row:2}

/* overlays */
.ov{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(51,40,95,.55);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-bottom,0px));animation:fadein .2s}
.ov[hidden]{display:none}
.ov-in{position:relative;display:grid;justify-items:center;gap:10px;text-align:center}
.rays{position:absolute;left:50%;top:42%;width:340px;height:340px;max-width:90vw;max-height:90vw;transform:translate(-50%,-50%);border-radius:50%;background:repeating-conic-gradient(rgba(255,210,81,.45) 0 10deg,transparent 10deg 20deg);animation:spin 8s linear infinite;pointer-events:none;-webkit-mask:radial-gradient(circle,#000 30%,transparent 70%);mask:radial-gradient(circle,#000 30%,transparent 70%)}
.big{position:relative;font-size:7rem;line-height:1;animation:popin .5s cubic-bezier(.3,1.6,.5,1)}
.bigword{position:relative;display:flex;gap:6px}
.bigword span{background:var(--tile);box-shadow:inset 0 -5px 0 var(--tile-edge);border-radius:12px;min-width:48px;padding:2px 8px 6px;font-size:2.4rem;font-weight:800;color:var(--ink);animation:popin .4s cubic-bezier(.3,1.6,.5,1) backwards}
.medal{position:relative;font-size:2.4rem;animation:popin .5s .5s cubic-bezier(.3,1.6,.5,1) backwards}
.gift{position:relative;font-size:8rem;line-height:1;background:none;border:0;cursor:pointer;animation:wiggle .7s ease-in-out infinite;padding:0}
.hand{position:relative;font-size:2.6rem;animation:tap 1s ease-in-out infinite}
.sheet{background:var(--card);border-radius:24px;padding:16px;width:min(420px,100%);max-height:80vh;overflow:auto;box-sizing:border-box;display:grid;gap:14px;position:relative}
.close{position:absolute;right:10px;top:10px;width:40px;height:40px;border-radius:50%;border:0;background:var(--sky);font-size:1.1rem;color:var(--ink);cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px;padding-top:30px}
.stk{aspect-ratio:1;border-radius:14px;background:var(--sky);display:grid;place-items:center;font-size:1.9rem;line-height:1}
.stk.no{filter:grayscale(1) brightness(1.3);opacity:.35}
.stk.gold{background:#FFF1C7;box-shadow:inset 0 0 0 3px var(--gold)}
.accs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;border-top:3px dashed var(--line);padding-top:14px}
.accs button{width:56px;height:56px;border-radius:50%;border:0;background:var(--sky);font-size:1.8rem;cursor:pointer}
.accs button[aria-pressed="true"]{background:var(--tile);box-shadow:inset 0 0 0 3px var(--tile-edge)}
.accs .lock{filter:grayscale(1);opacity:.3;cursor:default}
.flytile{position:fixed;z-index:15;border-radius:12px;background:var(--tile);box-shadow:inset 0 -5px 0 var(--tile-edge);display:grid;place-items:center;font-weight:800;color:var(--ink);transition:transform .4s cubic-bezier(.5,-.2,.4,1);pointer-events:none}
.confetti{position:fixed;top:-20px;width:10px;height:14px;border-radius:3px;z-index:30;pointer-events:none;animation:fall 1.8s ease-in forwards}

@keyframes bobble{50%{transform:translateY(-4%)}}
@keyframes pop{0%{transform:scale(.5)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes popin{0%{transform:scale(0)}100%{transform:scale(1)}}
@keyframes glow{50%{box-shadow:inset 0 -5px 0 var(--tile-edge),0 0 0 5px #fff}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes squish{40%{transform:scale(.85,1.1)}}
@keyframes jump{40%{transform:translateY(-30%)}}
@keyframes wiggle{25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}
@keyframes tap{50%{transform:translateY(-10px)}}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes fade{from{transform:scale(1.4);opacity:.9}to{transform:scale(.2);opacity:0}}
@keyframes ray{to{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}
@keyframes fadein{from{opacity:0}}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.7}}

@media (max-width:400px){.slot{font-size:1.5rem}.pic{width:58px;height:58px;font-size:2.7rem}.card{gap:9px;padding-inline:10px}.hear{width:46px;height:46px}.big{font-size:5.5rem}.gift{font-size:6.5rem}}

  .pad{grid-area:pad;grid-template-columns:repeat(3,76px);grid-template-rows:repeat(2,54px)}
}
@media not all and (min-width:900px) and (orientation:landscape){
  @media (min-height:780px){.card{padding:14px}.pic{width:76px;height:76px;font-size:3.4rem}.slot{flex-basis:54px;font-size:2rem}.hear{width:58px;height:58px}.pad{grid-template-columns:repeat(3,92px);grid-template-rows:repeat(2,64px);gap:10px}.pad button{font-size:1.8rem}.modes button{padding-block:9px}.wrap{gap:14px}}
  @media (max-height:700px){.pad{grid-template-rows:repeat(2,48px);grid-template-columns:repeat(3,70px)}.card{padding-block:8px}.pic{width:54px;height:54px;font-size:2.5rem}.wrap{gap:8px}}

  .giftmini{font-size:2rem}

  .slots{grid-area:slots;gap:10px}

  .slot.next,.slot.filled{border-width:4px}

}

<script>
const N=7, PER_GIFT=4;
const WORDS={"3": [["CAT", "🐱"], ["DOG", "🐶"], ["SUN", "☀️"], ["BUS", "🚌"], ["HAT", "🎩"], ["PIG", "🐷"], ["CUP", "☕"], ["BED", "🛏️"], ["BOX", "📦"], ["FOX", "🦊"], ["ANT", "🐜"], ["BAT", "🦇"], ["HEN", "🐔"], ["BUG", "🐛"], ["WEB", "🕸️"], ["PEN", "🖊️"], ["RAT", "🐀"], ["MAP", "🗺️"], ["CAN", "🥫"], ["FAN", "🪭"], ["VAN", "🚐"], ["NET", "🥅"], ["LEG", "🦵"], ["NUT", "🥜"], ["HUT", "🛖"], ["TUB", "🛁"], ["POT", "🍲"], ["LOG", "🪵"], ["SIX", "6️⃣"], ["TEN", "🔟"], ["KID", "🧒"], ["PIN", "📌"], ["BAG", "👜"], ["CAB", "🚕"], ["TAG", "🏷️"], ["HUG", "🤗"], ["RUN", "🏃"], ["NAP", "😴"], ["TAP", "🚰"], ["WET", "💦"], ["RED", "🔴"], ["MAN", "👨"], ["DAD", "👨‍👧"], ["MOM", "👩‍👧"], ["SAD", "😢"], ["MAD", "😠"], ["HOT", "🥵"], ["FIN", "🦈"]], "4": [["FROG", "🐸"], ["CRAB", "🦀"], ["DRUM", "🥁"], ["SLED", "🛷"], ["NEST", "🪺"], ["TENT", "⛺"], ["HAND", "✋"], ["PLUG", "🔌"], ["GIFT", "🎁"], ["MILK", "🥛"], ["FLAG", "🚩"], ["LIPS", "👄"], ["SWIM", "🏊"], ["MASK", "🎭"], ["STOP", "🛑"], ["CLAP", "👏"], ["FIST", "✊"], ["GRIN", "😁"], ["DRIP", "💧"], ["MELT", "🫠"], ["CAMP", "🏕️"], ["CLIP", "📎"], ["PLUS", "➕"], ["WIND", "🌬️"], ["JUMP", "🦘"], ["SAND", "🏖️"], ["LIST", "📝"]]};
// Gifts the unicorn can wear: emoji, x/y offset (% of body), size (× cell)
const ACC=[{e:"🎀",x:-16,y:-28,s:.42},{e:"🕶️",x:32,y:12,s:.42},{e:"👑",x:-6,y:-50,s:.5},{e:"🌸",x:-14,y:-24,s:.4},{e:"🪄",x:66,y:42,s:.44},{e:"🎩",x:0,y:-62,s:.5},{e:"🦋",x:-24,y:38,s:.4},{e:"🌟",x:-12,y:-34,s:.42}];
const $=id=>document.getElementById(id);
const board=$("board"),slotsEl=$("slots"),ov=$("ov"),ovIn=$("ovIn");

let save={wins:0,open:0,wear:-1,mode:"3"};
try{save=Object.assign(save,JSON.parse(localStorage.getItem("lg-save")||"{}"))}catch(e){}
const store=()=>{try{localStorage.setItem("lg-save",JSON.stringify(save))}catch(e){}};

let word="",emoji="",got=0,misses=0,wordMiss=0,pos={x:3,y:6},tiles=[],busy=false,talked=false,last="";

/* sound */
const player=new Audio();let playQ=[];
// Queue items: a clip key, or a number = pause in ms
let playTimer=null,playId=0;
function playNext(id){if(id!==playId||!playQ.length)return;const k=playQ.shift();
  if(typeof k==="number"){playTimer=setTimeout(()=>playNext(id),k);return}
  player.src=AUD[k];player.play().catch(()=>{})}
player.addEventListener("ended",()=>playNext(playId));
function say(keys){try{if(!talked)return;clearTimeout(playTimer);playId++;playQ=[].concat(keys).filter(k=>typeof k==="number"||AUD[k]);player.pause();playNext(playId)}catch(e){}}
let ac=null,sent="";
// sight-word sentence: # marks the word; shown as a blank in the card, highlighted in the intro
function sentHTML(show){return sent.replace(/#/g,(m,i)=>{if(!show)return '<span class="blank"></span>';const w=word.toLowerCase();return "<b>"+(i===0?w[0].toUpperCase()+w.slice(1):w)+"</b>"})}
function sfx(kind){try{if(!talked)return;ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==="suspended")ac.resume();
  const S={good:[[880,0],[1320,.07]],bad:[[200,0],[150,.12]],step:[[520,0]],win:[[523,0],[659,.1],[784,.2],[1047,.32]],gift:[[784,0],[988,.07],[1175,.14],[1568,.21],[2093,.3]]}[kind];
  const t=ac.currentTime;S.forEach(([f,d])=>{const o=ac.createOscillator(),g=ac.createGain();o.type=kind==="bad"?"triangle":"sine";o.frequency.value=f;
    const v=kind==="step"?.04:.14;g.gain.setValueAtTime(0,t+d);g.gain.linearRampToValueAtTime(v,t+d+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d+(kind==="bad"?.3:.22));
    o.connect(g).connect(ac.destination);o.start(t+d);o.stop(t+d+.35)})}catch(e){}}

/* helpers */
const lk=c=>save.mode==="S"?"N_"+c:c; // sight words are spelled with letter names
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function place(el,x,y){el.style.transform=`translate(${x*100}%,${y*100}%)`}
new ResizeObserver(()=>board.style.setProperty("--cell",board.clientWidth/N+"px")).observe(board);

/* unicorn */
const buddy=document.createElement("div");buddy.className="piece buddy";
buddy.innerHTML='<div class="bod"><div class="bob"><div class="horn"></div><div class="ear"></div><div class="mane"></div><div class="eye l"></div><div class="eye r"></div><div class="cheek"></div><span class="acc" id="acc"></span></div></div>';
function dress(){const a=buddy.querySelector(".acc"),c=ACC[save.wear];
  if(!c){a.textContent="";return}a.textContent=c.e;a.style.left=c.x+"%";a.style.top=c.y+"%";a.style.fontSize=`calc(var(--cell)*${c.s})`}

/* top bar */
function renderBar(){
  const n=save.wins%PER_GIFT,p=$("pips");p.innerHTML="";
  for(let i=0;i<PER_GIFT;i++){const d=document.createElement("span");d.className="pip"+(i<n?" on":"");p.appendChild(d)}
  const g=document.createElement("span");g.className="giftmini"+(n===PER_GIFT-1?" ready":"");g.textContent="🎁";p.appendChild(g);
}

/* round */
const bags={};
function pickWord(){
  // shuffled deck per mode; reshuffle when it runs out, never the same word twice in a row
  const m=save.mode;if(!bags[m]||!bags[m].length){bags[m]=shuffle(WORDS[m].slice());if(bags[m][bags[m].length-1][0]===last)bags[m].unshift(bags[m].pop())}
  return bags[m].pop();
}
function newWord(){
  busy=false;const it=pickWord();[word,emoji]=it;sent=it[2]||"";$("sent").innerHTML=sentHTML(false);last=word;got=0;misses=0;wordMiss=0;pos={x:3,y:6};
  $("pic").textContent=emoji;
  slotsEl.innerHTML="";[...word].forEach(()=>{const s=document.createElement("div");s.className="slot";slotsEl.appendChild(s)});
  board.innerHTML="";tiles=[];
  const free=[];for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(!(x===3&&y===6))free.push([x,y]);shuffle(free);
  const extras=shuffle("ABCDEFGHIJKLMNOPRSTUW".split("").filter(c=>!word.includes(c))).slice(0,word.length);
  [...word,...extras].forEach((ch,i)=>{const[x,y]=free[i];const p=document.createElement("div");p.className="piece";
    const t=document.createElement("div");t.className="tile";t.textContent=ch;p.appendChild(t);place(p,x,y);board.appendChild(p);tiles.push({x,y,ch,p,t})});
  board.appendChild(buddy);place(buddy,pos.x,pos.y);dress();
  updateSlots();renderBar();say(sent?[word,600,"S_"+word]:word);intro();
}
function updateSlots(){
  [...slotsEl.children].forEach((s,i)=>{s.classList.toggle("next",i===got);if(i<got&&!s.textContent){s.textContent=word[i];s.classList.add("filled")}});
  tiles.forEach(t=>t.t.classList.remove("glow"));
  if(misses>=2)tiles.filter(t=>t.ch===word[got]).forEach(t=>t.t.classList.add("glow"));
}


/* word intro: the picture and blanks appear big in the middle while the word is read,
   then each piece flies into its place in the word card */
function intro(){
  const pic=$("pic"),slots=[...slotsEl.children];
  if(!pic.getBoundingClientRect().width)return;
  busy=true;const sight=save.mode==="S",calm=matchMedia("(prefers-reduced-motion:reduce)").matches;
  const dim=document.createElement("div");dim.className="intro-dim";
  const box=document.createElement("div");box.className="intro"+(sight?" sight":"");
  box.innerHTML=`<div class="ipic">${emoji}</div>`+(sent?`<div class="isent">${sentHTML(true)}</div>`:"")+`<div class="islots">${[...word].map(c=>`<div class="islot">${sight?c:""}</div>`).join("")}</div>`;
  document.body.append(dim,box);
  const parts=[...box.querySelectorAll(".ipic,.islot")],targets=[pic].concat(slots);
  targets.forEach(e=>e.style.visibility="hidden");
  parts.forEach((p,i)=>p.animate([{transform:"scale(.3)",opacity:0},{transform:"none",opacity:1}],{duration:calm?0:380,delay:calm?0:i*70,easing:"cubic-bezier(.3,1.6,.5,1)",fill:"backwards"}));
  dim.animate([{opacity:0},{opacity:1}],{duration:calm?0:250});
  let done=false;
  const shrink=()=>{if(done)return;done=true;clearTimeout(hold);box.classList.add("fading");
    let left=parts.length;
    parts.forEach((p,i)=>{const a=p.getBoundingClientRect(),b=targets[i].getBoundingClientRect();
      const an=p.animate([{transform:"none"},{transform:`translate(${b.left-a.left}px,${b.top-a.top}px) scale(${b.width/a.width},${b.height/a.height})`}],
        {duration:calm?0:560,delay:calm?0:i*40,easing:"cubic-bezier(.5,0,.25,1)",fill:"forwards"});
      an.onfinish=()=>{targets[i].style.visibility="";p.style.visibility="hidden";if(--left===0){box.remove();dim.remove();busy=false}}});
    dim.animate([{opacity:1},{opacity:0}],{duration:calm?0:560,fill:"forwards"});
  };
  const hold=setTimeout(shrink,sight?3400:1900);
  dim.addEventListener("click",()=>{talked=true;shrink()});
}
/* movement */
function move(dx,dy){
  talked=true;if(busy||!ov.hidden)return;
  const nx=pos.x+dx,ny=pos.y+dy;
  if(dx)buddy.querySelector(".bod").style.transform=dx<0?"scaleX(-1)":"";
  if(nx<0||ny<0||nx>=N||ny>=N){bump();return}
  trail(pos.x,pos.y);pos={x:nx,y:ny};place(buddy,nx,ny);sfx("step");
  const t=tiles.find(t=>t.x===nx&&t.y===ny);if(t)setTimeout(()=>step(t),120);
}
const RAIN=["#FF8FB8","#FFB86B","#FFE07A","#8FE3A8","#8FD3FF","#B49BFF"];let ri=0;
function trail(x,y){const d=document.createElement("div");d.className="trail";d.innerHTML=`<i style="background:${RAIN[ri++%6]}"></i>`;place(d,x,y);board.insertBefore(d,buddy);setTimeout(()=>d.remove(),650)}
function burst(x,y){const b=document.createElement("div");b.className="burst";place(b,x,y);
  for(let i=0;i<10;i++){const a=i/10*Math.PI*2,r=document.createElement("i");r.style.background=RAIN[i%6];r.style.setProperty("--dx",Math.cos(a)*220+"%");r.style.setProperty("--dy",Math.sin(a)*220+"%");b.appendChild(r)}
  board.appendChild(b);setTimeout(()=>b.remove(),600)}
function bump(){buddy.classList.remove("bump");void buddy.offsetWidth;buddy.classList.add("bump")}

function step(t){
  if(t.ch===word[got]){
    tiles=tiles.filter(x=>x!==t);burst(t.x,t.y);sfx("good");
    const slot=slotsEl.children[got],idx=got;got++;misses=0;
    fly(t,slot,()=>{if(idx<word.length)updateSlots()});
    t.t.classList.add("gone");setTimeout(()=>t.p.remove(),200);
    [...slotsEl.children].forEach((s,i)=>s.classList.toggle("next",i===got));
    tiles.forEach(x=>x.t.classList.remove("glow"));
    if(got===word.length){busy=true;say([lk(t.ch),900,word]);setTimeout(win,1500)}else say(lk(t.ch));
  }else{
    misses++;wordMiss++;sfx("bad");say(lk(t.ch));
    [t.t,board].forEach(el=>{el.classList.remove("wrong");void el.offsetWidth;el.classList.add("wrong")});
    clearTimeout(t.wt);t.wt=setTimeout(()=>{t.t.classList.remove("wrong");board.classList.remove("wrong")},900);
    bump();updateSlots();
  }
}
function fly(t,slot,done){
  const a=t.t.getBoundingClientRect(),b=slot.getBoundingClientRect();
  const f=document.createElement("div");f.className="flytile";f.textContent=t.ch;
  Object.assign(f.style,{left:a.left+"px",top:a.top+"px",width:a.width+"px",height:a.height+"px",fontSize:a.height*.6+"px"});
  document.body.appendChild(f);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{f.style.transform=`translate(${b.left+b.width/2-(a.left+a.width/2)}px,${b.top+b.height/2-(a.top+a.height/2)}px) scale(${b.width/a.width})`}));
  setTimeout(()=>{f.remove();done()},420);
}

/* rewards */
function win(){
  const perfect=wordMiss===0;save.wins++;store();
  buddy.classList.remove("happy");void buddy.offsetWidth;buddy.classList.add("happy");
  sfx("win");confetti(perfect?60:36);
  ovIn.innerHTML=`<div class="rays"></div><div class="big">${emoji||"🌈"}</div><div class="bigword">${[...word].map((c,i)=>`<span style="animation-delay:${.15+i*.08}s">${c}</span>`).join("")}</div>${perfect?'<div class="medal">🌟</div>':""}`;
  ov.hidden=false;
  const giftTime=save.wins%PER_GIFT===0;
  setTimeout(()=>{
    ov.hidden=true;renderBar();
    if(giftTime)showGift();else newWord();
  },2100);
}
function showGift(){
  sfx("gift");
  ovIn.innerHTML='<div class="rays"></div><button class="gift" id="giftBtn" aria-label="Open your gift">🎁</button><div class="hand" aria-hidden="true">👆</div>';
  ov.hidden=false;$("giftBtn").focus();
  $("giftBtn").addEventListener("click",openGift,{once:true});
}
function openGift(){
  let i=save.open;
  if(i<ACC.length){save.open++;save.wear=i}else{i=Math.random()*ACC.length|0;save.wear=i}
  store();dress();sfx("gift");confetti(70);
  ovIn.innerHTML=`<div class="rays"></div><div class="big">${ACC[i].e}</div>`;
  const go=()=>{ov.hidden=true;ov.removeEventListener("click",go);newWord()};
  setTimeout(()=>ov.addEventListener("click",go),400);setTimeout(()=>{if(!ov.hidden)go()},2600);
}
function confetti(n){
  if(matchMedia("(prefers-reduced-motion:reduce)").matches)return;
  for(let i=0;i<n;i++){const c=document.createElement("div");c.className="confetti";
    c.style.left=Math.random()*100+"vw";c.style.background=RAIN[i%6];c.style.animationDelay=Math.random()*.5+"s";
    document.body.appendChild(c);setTimeout(()=>c.remove(),2500)}
}

/* input */
document.addEventListener("keydown",e=>{
  const k={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]}[e.key];
  if(k){e.preventDefault();move(...k)}
});
document.querySelectorAll(".pad button").forEach(b=>b.addEventListener("click",()=>move(...b.dataset.d.split(",").map(Number))));
let start=null;
board.addEventListener("pointerdown",e=>{start={x:e.clientX,y:e.clientY}});
board.addEventListener("pointerup",e=>{
  if(!start)return;const dx=e.clientX-start.x,dy=e.clientY-start.y;start=null;
  if(Math.max(Math.abs(dx),Math.abs(dy))>24){Math.abs(dx)>Math.abs(dy)?move(Math.sign(dx),0):move(0,Math.sign(dy));return}
  const r=board.getBoundingClientRect(),cx=Math.floor((e.clientX-r.left)/r.width*N),cy=Math.floor((e.clientY-r.top)/r.height*N);
  const ddx=cx-pos.x,ddy=cy-pos.y;if(!ddx&&!ddy)return;
  Math.abs(ddx)>=Math.abs(ddy)?move(Math.sign(ddx),0):move(0,Math.sign(ddy));
});
const hear=()=>{talked=true;say(sent?[word,600,"S_"+word]:word)};
$("hear").addEventListener("click",hear);$("pic").addEventListener("click",hear);
function renderModes(){document.body.classList.toggle("sight",save.mode==="S");document.querySelectorAll("#modes button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.m===save.mode))}
document.querySelectorAll("#modes button").forEach(b=>b.addEventListener("click",()=>{if(busy||!ov.hidden)return;talked=true;save.mode=b.dataset.m;store();renderModes();last="";newWord()}));
if(!WORDS[save.mode])save.mode="3";
renderModes();
$("startLogo").src=document.querySelector(".brand img").src;
function begin(){
  if(begin.done)return;begin.done=true;talked=true;
  try{if(navigator.audioSession)navigator.audioSession.type="playback"}catch(e){} // play even with the silent switch on
  try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();ac.resume()}catch(e){}
  $("start").remove();newWord(); // newWord reads the word inside this tap, which unlocks sound for the whole session
}
$("go").addEventListener("click",begin);$("start").addEventListener("click",begin);
document.addEventListener("keydown",e=>{if(!begin.done&&(e.key==="Enter"||e.key===" ")){e.preventDefault();begin()}});
</script>
